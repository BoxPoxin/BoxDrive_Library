sentence=Complete closed-loop stepper controller library for BoxDrive (ESP32-C6 + TMC2209 + AS5600 + CAN).
paragraph=Supports StealthChop/SpreadCycle silent driving, AS5600 12-bit encoder feedback, closed-loop PID position control, encoder motion recording and playback, CAN bus daisy-chain with copy-control, WiFi hotspot with web dashboard, BLE control, StallGuard stall detection, sensorless homing, trapezoidal/S-curve/sinusoidal speed profiles, and full TMC2209 UART register access.
